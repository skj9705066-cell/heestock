<!DOCTYPE html>
<html>
<head>
  <title>관심종목 확인</title>
  <style>
    body { font-family: monospace; padding: 20px; }
    pre { background: #f4f4f4; padding: 15px; border-radius: 5px; }
    button { padding: 10px 20px; margin: 10px 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>관심종목 localStorage 확인</h1>
  <button onclick="checkWatchlist()">관심종목 확인</button>
  <button onclick="clearWatchlist()">관심종목 전체 삭제</button>
  <button onclick="addPadu()">파두 추가 (KR)</button>
  <button onclick="addSamsung()">삼성전자 추가 (KR)</button>

  <div id="output"></div>

  <script>
    function checkWatchlist() {
      const data = localStorage.getItem('heestock_watchlist');
      const output = document.getElementById('output');

      if (!data) {
        output.innerHTML = '<h2>관심종목이 없습니다</h2>';
        return;
      }

      try {
        const list = JSON.parse(data);

        // 문제 종목 검증
        const problems = [];
        list.forEach((item, i) => {
          if (!item.market) {
            problems.push(`${i}: ${item.name}(${item.symbol}) - market 필드 없음`);
          }
          if (!item.symbol || item.symbol.length !== 6) {
            problems.push(`${i}: ${item.name}(${item.symbol}) - symbol 길이 ${item.symbol?.length ?? 0}자 (6자 필요)`);
          }
          if (typeof item.symbol === 'number') {
            problems.push(`${i}: ${item.name}(${item.symbol}) - symbol이 숫자 타입 (문자열 필요)`);
          }
        });

        let html = `<h2>관심종목 (${list.length}개)</h2>`;

        if (problems.length > 0) {
          html += `<h3 style="color: red;">⚠️ 문제 발견 (${problems.length}개)</h3><ul>`;
          problems.forEach(p => {
            html += `<li>${p}</li>`;
          });
          html += '</ul>';
        } else {
          html += '<h3 style="color: green;">✓ 모든 종목 정상</h3>';
        }

        html += `<pre>${JSON.stringify(list, null, 2)}</pre>`;
        output.innerHTML = html;
      } catch (e) {
        output.innerHTML = `<h2>에러: ${e.message}</h2><pre>${data}</pre>`;
      }
    }

    function clearWatchlist() {
      if (confirm('관심종목을 전체 삭제하시겠습니까?')) {
        localStorage.removeItem('heestock_watchlist');
        alert('삭제 완료');
        checkWatchlist();
      }
    }

    function addPadu() {
      const list = JSON.parse(localStorage.getItem('heestock_watchlist') || '[]');
      if (!list.some(x => x.symbol === '440110')) {
        list.unshift({
          symbol: '440110',
          name: '파두',
          market: 'KR',
          sector: '전기전자',
          addedAt: Date.now()
        });
        localStorage.setItem('heestock_watchlist', JSON.stringify(list));
        alert('파두 추가 완료');
        checkWatchlist();
      } else {
        alert('이미 추가되어 있습니다');
      }
    }

    function addSamsung() {
      const list = JSON.parse(localStorage.getItem('heestock_watchlist') || '[]');
      if (!list.some(x => x.symbol === '005930')) {
        list.unshift({
          symbol: '005930',
          name: '삼성전자',
          market: 'KR',
          sector: '전기전자',
          addedAt: Date.now()
        });
        localStorage.setItem('heestock_watchlist', JSON.stringify(list));
        alert('삼성전자 추가 완료');
        checkWatchlist();
      } else {
        alert('이미 추가되어 있습니다');
      }
    }

    // 페이지 로드 시 자동 확인
    checkWatchlist();
  </script>
</body>
</html>
